# Local Ignition 8.3 gateway used only to produce real tag exports for the interpreter fixtures.
# Bound to 127.0.0.1. Trial mode (resets every two hours). Starting it accepts the Ignition EULA.
#   docker compose -f ignition-lab/compose.yml --env-file ignition-lab/.env up -d
# ignition-lab/.env holds GATEWAY_ADMIN_PASSWORD for this local gateway only (see .env.example).
services:
  ignition:
    image: inductiveautomation/ignition:8.3.10
    container_name: mimir-ignition-lab
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      ACCEPT_IGNITION_EULA: "Y"
      IGNITION_EDITION: standard
      GATEWAY_ADMIN_USERNAME: admin
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD}
      DISABLE_QUICKSTART: "true"
      TZ: UTC
    command: -n mimir-ignition-lab
    volumes:
      - ignition-data:/usr/local/bin/ignition/data

volumes:
  ignition-data:
